<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Hangar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Russo+One&display=swap">
<style>
/* Layout: arcade hangar — one headline, two big game cabinets side by side, stacking on phones */
:root{
  --bg:#06071a; --ink:#f1f0ff; --dim:#a3a6cf;
  --cyan:#7ff3ff; --pink:#ff3fa4; --amber:#ffbf5e;
  --display:'Russo One','Arial Black',Impact,sans-serif;
  --hud:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--hud);
  background-image:radial-gradient(ellipse at 50% -10%,rgba(127,90,255,.28),transparent 60%),
    linear-gradient(rgba(127,243,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(127,243,255,.05) 1px,transparent 1px);
  background-size:auto,40px 40px,40px 40px;
  padding-block:max(40px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:36px}
header{text-align:center;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-weight:600;font-size:13px;letter-spacing:.4em;color:var(--amber)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,9vw,88px);line-height:.9;margin:0;text-wrap:balance;
  background:linear-gradient(180deg,#fff 20%,var(--cyan) 60%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:in .8s cubic-bezier(.2,1.4,.4,1) both}
.lead{color:var(--dim);margin:0;font-size:16px}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px;width:min(980px,100%)}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:400px;padding:28px;
  color:var(--ink);text-decoration:none;overflow:hidden;border:1px solid rgba(255,255,255,.12);
  clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px));
  transition:transform .25s cubic-bezier(.2,1.4,.4,1),border-color .2s;animation:in .7s both}
.card:nth-child(2){animation-delay:.12s}
.card:hover,.card:focus-visible{transform:translateY(-6px) scale(1.015);outline:none}
.card:focus-visible{border-color:var(--amber)}
.art{position:absolute;inset:0;z-index:-1}
.sky .art{background:linear-gradient(180deg,#0a0f2e 0%,#2a2363 35%,#9b4579 58%,#ef8a6a 68%,#ffd193 72%,#7a4a78 73%,#2c2554 85%,#0c0e2a 100%)}
.sky .sun{position:absolute;right:22%;top:58%;width:70px;height:70px;border-radius:50%;background:#fff3d6;box-shadow:0 0 80px 30px rgba(255,190,120,.6);transform:translateY(-50%)}
.sky .jet{position:absolute;left:50%;top:38%;width:130px;height:40px;transform:translate(-50%,-50%);animation:bank 3s ease-in-out infinite alternate}
.sky .jet::before{content:"";position:absolute;inset:14px 0 auto;height:8px;background:linear-gradient(#e2e7ff,#5d6596);clip-path:polygon(0 60%,42% 0,58% 0,100% 60%,100% 100%,0 100%)}
.sky .jet::after{content:"";position:absolute;left:50%;top:6px;width:34px;height:30px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 50% 70%,#7ff3ff 0 18%,#eef1ff 20%,#4a5182 70%)}
.sky .tracer{position:absolute;top:44%;width:2px;height:120px;background:linear-gradient(transparent,var(--cyan));animation:shoot .5s linear infinite}
.sky .tracer.a{left:42%}.sky .tracer.b{left:58%;animation-delay:.25s}
.road .art{background:linear-gradient(180deg,#05061a 0%,#1d1048 40%,#5a1a6a 55%,#07071a 56%)}
.road .lane{position:absolute;left:50%;bottom:0;width:120%;height:45%;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent 18%,var(--pink) 18% 20%,#1f1d3d 20% 80%,var(--pink) 80% 82%,transparent 82%);
  clip-path:polygon(47% 0,53% 0,100% 100%,0 100%)}
.road .stripe{position:absolute;left:50%;bottom:0;width:6px;height:45%;transform:translateX(-50%);
  background:repeating-linear-gradient(180deg,var(--cyan) 0 18px,transparent 18px 40px);animation:dash .35s linear infinite;
  clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);opacity:.8}
.road .city{position:absolute;left:0;right:0;top:30%;height:26%;
  background:linear-gradient(90deg,#17143a 0 8%,transparent 8% 10%,#17143a 10% 22%,transparent 22% 24%,#17143a 24% 30%,transparent 30% 33%,#17143a 33% 48%,transparent 48% 50%,#17143a 50% 61%,transparent 61% 63%,#17143a 63% 78%,transparent 78% 80%,#17143a 80% 100%);
  clip-path:polygon(0 30%,8% 30%,8% 0,22% 0,22% 45%,30% 45%,30% 15%,48% 15%,48% 50%,61% 50%,61% 10%,78% 10%,78% 35%,100% 35%,100% 100%,0 100%)}
.road .car{position:absolute;left:50%;bottom:10%;width:120px;height:46px;transform:translateX(-50%);background:var(--cyan);
  clip-path:polygon(0 55%,6% 20%,24% 10%,76% 10%,94% 20%,100% 55%,96% 90%,4% 90%);
  box-shadow:0 0 0 rgba(0,0,0,0);animation:wobble .25s ease-in-out infinite alternate}
.road .car::after{content:"";position:absolute;left:6%;right:6%;top:42%;height:12%;background:linear-gradient(90deg,#ff2050 0 26%,transparent 26% 74%,#ff2050 74%)}
.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 35%,rgba(6,7,26,.92) 85%)}
.tag{font-weight:600;font-size:12px;letter-spacing:.3em;color:var(--amber)}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,46px);margin:6px 0 8px;line-height:1}
.card p{margin:0 0 18px;color:var(--dim);line-height:1.55;max-width:40ch}
.play{align-self:flex-start;font-weight:700;font-size:15px;letter-spacing:.28em;padding:12px 28px;color:#0a0d22;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:filter .2s}
.sky .play{background:var(--cyan)} .road .play{background:var(--pink)}
.card:hover .play,.card:focus-visible .play{filter:brightness(1.2)}
.meta{display:flex;gap:18px;margin-bottom:16px;font-size:12px;color:var(--ink);letter-spacing:.08em}
.meta span{display:flex;flex-direction:column;gap:2px}
.meta small{color:var(--dim);font-size:10px;letter-spacing:.2em}
footer{color:var(--dim);font-size:12px;letter-spacing:.1em}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bank{from{transform:translate(-70%,-50%) rotate(-10deg)}to{transform:translate(-30%,-40%) rotate(10deg)}}
@keyframes shoot{from{transform:translateY(0) scaleY(1);opacity:1}to{transform:translateY(-140px) scaleY(.3);opacity:0}}
@keyframes dash{from{background-position:0 0}to{background-position:0 40px}}
@keyframes wobble{from{transform:translateX(-52%)}to{transform:translateX(-48%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="eyebrow">PLAYER 1 · SELECT</div>
  <h1>GAME HANGAR</h1>
  <p class="lead">플레이할 게임을 고르세요</p>
</header>
<main>
  <a class="card sky" href="skybreaker.html">
    <div class="art"><div class="sun"></div><span class="tracer a"></span><span class="tracer b"></span><div class="jet"></div></div>
    <div class="tag">공중전 슈팅</div>
    <h2>SKYBREAKER</h2>
    <p>해 질 녘 바다 위, 적 편대를 요격하고 록온 미사일로 거대 비행요새를 격추하세요.</p>
    <div class="meta"><span><small>조작</small>WASD · 마우스</span><span><small>특수</small>미사일 · 배럴 롤</span></div>
    <span class="play">출격</span>
  </a>
  <a class="card road" href="midnight-circuit.html">
    <div class="art"><div class="city"></div><div class="lane"></div><div class="stripe"></div><div class="car"></div></div>
    <div class="tag">네온 레이싱</div>
    <h2>MIDNIGHT CIRCUIT</h2>
    <p>자정의 고속도로 3바퀴. 니트로를 터뜨려 라이벌 9대를 제치고 1위로 들어오세요.</p>
    <div class="meta"><span><small>조작</small>방향키 · WASD</span><span><small>특수</small>니트로 부스트</span></div>
    <span class="play">레이스</span>
  </a>
</main>
<footer>각 게임 메뉴의 "← 게임 목록"으로 돌아올 수 있습니다</footer>
</body>
</html>
