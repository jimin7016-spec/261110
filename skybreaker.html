<title>Skybreaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Russo+One&display=swap">
<style>
/* Layout: full-bleed canvas cockpit at dusk over the sea; DOM only for menus. Single dark look by design. */
:root{
  --night:#070a1f;
  --ink:#eef2ff;
  --dim:#a3abd9;
  --cyan:#7ff3ff;
  --hot:#ff4f6d;
  --amber:#ffbf5e;
  --display:'Russo One','Arial Black',Impact,sans-serif;
  --hud:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--hud);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#safe{position:fixed;inset:0;pointer-events:none;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 45%,rgba(7,10,31,.05) 0%,rgba(7,10,31,.55) 70%,rgba(7,10,31,.85) 100%);
  transition:opacity .5s ease, transform .5s ease}
.screen.off{opacity:0;pointer-events:none;transform:scale(1.06)}
.eyebrow{font:600 13px var(--hud);letter-spacing:.42em;color:var(--amber);text-transform:uppercase;animation:fadeUp .8s .2s both}
.title{font-family:var(--display);font-size:clamp(46px,12vw,136px);line-height:.88;letter-spacing:.02em;margin:0;white-space:nowrap}
.title span{display:inline-block;background:linear-gradient(180deg,#ffffff 0%,#ffe2b8 48%,#ff7a86 78%,#b6407a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(20,10,50,.55));
  animation:drop .9s cubic-bezier(.2,1.5,.4,1) both, bob 3.2s ease-in-out infinite alternate;
  animation-delay:calc(var(--i) * 55ms), calc(1s + var(--i) * 120ms)}
@keyframes drop{from{transform:translateY(-140px) rotate(-14deg) scale(1.7);opacity:0;filter:blur(10px)}to{transform:none;opacity:1}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sub{font:500 clamp(14px,2.2vw,18px)/1.5 var(--hud);color:var(--dim);max-width:34ch;margin:0;animation:fadeUp .8s .5s both}
.keys{display:grid;grid-template-columns:auto auto;gap:8px 18px;align-items:center;text-align:left;font:500 14px var(--hud);color:var(--dim);animation:fadeUp .8s .7s both}
.keys b{font-weight:600;color:var(--ink);justify-self:end;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
kbd{font:600 12px var(--hud);color:var(--ink);background:rgba(127,243,255,.08);border:1px solid rgba(127,243,255,.35);border-bottom-width:3px;border-radius:5px;padding:2px 7px}
.btn{font:700 19px var(--hud);letter-spacing:.32em;text-indent:.32em;color:#0a0d22;background:linear-gradient(90deg,var(--cyan),#d6fdff 60%,var(--cyan));background-size:200% 100%;border:0;padding:16px 50px;
  clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);cursor:pointer;transition:transform .15s ease,filter .15s ease;animation:fadeUp .8s .9s both, sheen 2.4s linear infinite}
.btn:hover{transform:scale(1.07) skewX(-4deg);filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:none;background:linear-gradient(90deg,var(--amber),#fff0d0)}
@keyframes sheen{from{background-position:0 0}to{background-position:-200% 0}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;width:min(560px,100%);animation:fadeUp .7s .3s both}
.stat{display:flex;flex-direction:column;gap:4px;padding:12px 8px;border-top:2px solid rgba(127,243,255,.35)}
.stat span{font:600 11px var(--hud);letter-spacing:.24em;color:var(--dim)}
.stat strong{font:700 26px var(--hud);font-variant-numeric:tabular-nums;color:var(--ink)}
.stat.hi strong{color:var(--amber)}
.over-title{font-family:var(--display);font-size:clamp(52px,12vw,120px);margin:0;line-height:.9;color:var(--hot);animation:slam .7s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 0 40px rgba(255,79,109,.45)}
@keyframes slam{from{transform:scale(2.6) rotate(6deg);opacity:0;filter:blur(12px)}to{transform:none;opacity:1}}
.badge{font:700 13px var(--hud);letter-spacing:.3em;color:#0a0d22;background:var(--amber);padding:5px 12px;animation:fadeUp .6s .6s both}
.hint{font:500 12px var(--hud);color:var(--dim);letter-spacing:.08em;animation:fadeUp .8s 1.1s both}

#mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(127,243,255,.35);background:rgba(7,10,31,.45);color:var(--ink);font:600 11px var(--hud);letter-spacing:.06em;cursor:pointer;z-index:5}
#mute:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#touch{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;z-index:4}
[hidden]{display:none!important}
#touch button{width:68px;height:68px;border-radius:50%;border:2px solid rgba(127,243,255,.5);background:rgba(7,10,31,.45);color:var(--ink);font:700 13px var(--hud);letter-spacing:.06em;touch-action:none}
#touch button:active{background:rgba(127,243,255,.3)}
#pause{background:rgba(7,10,31,.6)}
@media (prefers-reduced-motion: reduce){
  .title span,.eyebrow,.sub,.keys,.btn,.stats,.over-title,.badge,.hint{animation:none!important}
}
</style>

<canvas id="c" aria-label="Skybreaker game screen"></canvas>
<div id="safe"></div>
<button id="mute" type="button" aria-label="Toggle sound">SND</button>

<section class="screen" id="titleScreen">
  <div class="eyebrow">고고도 요격 작전</div>
  <h1 class="title" id="titleText">SKYBREAKER</h1>
  <p class="sub">해 질 녘 바다 위, 적 편대가 몰려옵니다. 날아오는 탄을 피하고, 록온 미사일로 비행요새를 격추하세요.</p>
  <div class="keys">
    <b><kbd>WASD</kbd><kbd>방향키</kbd><kbd>마우스</kbd></b><span>기체 조종</span>
    <b><kbd>Space</kbd><kbd>왼쪽 클릭</kbd></b><span>기관포 사격</span>
    <b><kbd>F</kbd><kbd>오른쪽 클릭</kbd></b><span>록온 미사일 발사</span>
    <b><kbd>Shift</kbd></b><span>배럴 롤 (무적 회피)</span>
    <b><kbd>P</kbd><kbd>M</kbd></b><span>일시정지 · 음소거</span>
  </div>
  <button class="btn" id="startBtn" type="button">출격</button>
  <div class="hint" id="touchHint" hidden>모바일: 화면을 드래그해 조종하면 자동으로 사격합니다</div>
</section>

<section class="screen off" id="overScreen" aria-live="polite">
  <h2 class="over-title">격추</h2>
  <div class="badge" id="newHi" hidden>신기록</div>
  <div class="stats">
    <div class="stat"><span>점수</span><strong id="sScore">0</strong></div>
    <div class="stat hi"><span>최고 기록</span><strong id="sHi">0</strong></div>
    <div class="stat"><span>웨이브</span><strong id="sWave">0</strong></div>
    <div class="stat"><span>격추 수</span><strong id="sKills">0</strong></div>
    <div class="stat"><span>최대 콤보</span><strong id="sCombo">0</strong></div>
  </div>
  <button class="btn" id="retryBtn" type="button">다시 출격</button>
</section>

<section class="screen off" id="pause">
  <h2 class="over-title" style="color:var(--cyan);text-shadow:0 0 40px rgba(127,243,255,.4)">일시정지</h2>
  <button class="btn" id="resumeBtn" type="button">계속</button>
</section>

<div id="touch" hidden>
  <button id="tMissile" type="button">미사일</button>
  <button id="tRoll" type="button">롤</button>
</div>

<script>
(() => {
'use strict';
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch = matchMedia('(pointer: coarse)').matches;
const TAU = Math.PI * 2;
const HUDF = '"Chakra Petch","Segoe UI",system-ui,sans-serif';
const DISPF = '"Russo One","Arial Black",Impact,sans-serif';
const R = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// ---------- world constants ----------
const PZ = 12, XB = 9, YLO = -4, YHI = 5, SEA = -14;

let W = 0, H = 0, DPR = 1, CX = 0, HY = 0, F0 = 600, F = 600;
let camX = 0, camY = 2.6;
const safe = { t: 0, r: 0, b: 0, l: 0 };
let vignette = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  CX = W / 2; HY = H * 0.40;
  F0 = Math.min(H * 0.95, W * 1.05);
  if (!F || state === 'title') F = F0;
  const cs = getComputedStyle(document.getElementById('safe'));
  safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
  safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
  vignette = document.createElement('canvas');
  vignette.width = Math.max(1, Math.round(W / 2)); vignette.height = Math.max(1, Math.round(H / 2));
  const vg = vignette.getContext('2d');
  const g = vg.createRadialGradient(vignette.width / 2, vignette.height * 0.5, Math.min(W, H) * 0.18, vignette.width / 2, vignette.height * 0.5, Math.max(W, H) * 0.42);
  g.addColorStop(0, 'rgba(5,6,22,0)'); g.addColorStop(1, 'rgba(5,6,22,0.62)');
  vg.fillStyle = g; vg.fillRect(0, 0, vignette.width, vignette.height);
}

// ---------- sprites ----------
function glowSprite(rgb, size = 64, core = 0.18) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(core, `rgba(${rgb},0.9)`);
  gr.addColorStop(0.45, `rgba(${rgb},0.28)`);
  gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return c;
}
const G = {
  cyan: glowSprite('110,240,255'),
  hot: glowSprite('255,70,110'),
  amber: glowSprite('255,180,80'),
  fire: glowSprite('255,120,40', 64, 0.12),
  white: glowSprite('255,245,235', 64, 0.3),
  green: glowSprite('110,255,170'),
  sun: glowSprite('255,190,120', 128, 0.08),
};
const smokeSpr = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(70,58,92,0.8)'); gr.addColorStop(0.6, 'rgba(60,50,82,0.35)'); gr.addColorStop(1, 'rgba(60,50,82,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
})();
const vaporSpr = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(235,228,245,0.7)'); gr.addColorStop(1, 'rgba(235,228,245,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
})();
function makeCloud() {
  const c = document.createElement('canvas'); c.width = 320; c.height = 160;
  const g = c.getContext('2d');
  const n = 16 + Math.floor(Math.random() * 6);
  for (let i = 0; i < n; i++) {
    const x = R(60, 260), r = R(20, 46);
    const y = R(70, 112) - Math.sin((x - 60) / 200 * Math.PI) * R(15, 35);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(0.6, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  g.globalCompositeOperation = 'source-atop';
  const lg = g.createLinearGradient(0, 30, 0, 150);
  lg.addColorStop(0, 'rgba(255,220,185,0.6)'); lg.addColorStop(0.45, 'rgba(240,150,165,0.55)'); lg.addColorStop(1, 'rgba(80,62,140,0.8)');
  g.fillStyle = lg; g.fillRect(0, 0, 320, 160);
  return c;
}
const cloudSprites = [makeCloud(), makeCloud(), makeCloud(), makeCloud()];

// background islands & stars
function ridge(n, amp) { const a = []; let h = 0; for (let i = 0; i < n; i++) { h = clamp(h + R(-1, 1) * amp * 0.5, 0, amp); a.push(i % 9 < 5 ? h : h * 0.15); } return a; }
const ridgeFar = ridge(160, 1), ridgeNear = ridge(120, 1);
const stars = Array.from({ length: 90 }, () => ({ x: R(-1, 2), y: R(0.05, 0.9), r: R(0.5, 1.6), p: R(0, TAU) }));

// ---------- state ----------
let state = 'title';
let paused = false;
let T = 0, SPD = 60, warp = 0, nextWave = 1;
let shake = 0, hurtFlash = 0, whiteout = 0, flashA = 0;
let timeScale = 1, slowT = 0, deathT = 0;
let score = 0, dispScore = 0, wave = 0, kills = 0, combo = 0, comboT = 0, maxCombo = 0, comboPunch = 0, scorePunch = 0;
let hiScore = 0;
try { hiScore = parseInt(localStorage.getItem('skybreaker-hi') || '0', 10) || 0; } catch (e) { }
let waveEvents = [], waveClock = 0, waveActive = false, boss = null, attractT = 0;
let banner = null;
let ret = { x: 0, y: 0, s: 1 }, locked = [];

const P = { kind: 'player', x: 0, y: 0, z: PZ, vx: 0, vy: 0, hp: 100, maxHp: 100, ghost: 100, ghostT: 0, weapon: 1, ammo: 4, mCharge: 0,
  fireCd: 0, side: 0, bank: 0, spin: 0, pitch: 0, barrel: 0, barrelDir: 1, rollCd: 0, inv: 0, muzzle: 0, alive: true };
let enemies = [], pB = [], eB = [], missiles = [], parts = [], pickups = [], rings = [], popups = [];
const clouds = [], streaks = [], speedLines = [];
const trails = [[], []];

const TYPES = {
  drone: { hp: 2, rx: 1.8, ry: 1.0, score: 100 },
  fighter: { hp: 9, rx: 2.5, ry: 1.1, score: 300 },
  heavy: { hp: 45, rx: 4.9, ry: 1.6, score: 1000 },
  boss: { hp: 700, rx: 11, ry: 3.8, score: 20000 },
};

function proj(x, y, z) { const s = F / z; return { x: CX + (x - camX) * s, y: HY - (y - camY) * s, s }; }

// ---------- audio ----------
let AC = null, master = null, noiseBuf = null, engOsc = null, engFilter = null, muted = false, lastShootSnd = 0;
try { muted = localStorage.getItem('skybreaker-mute') === '1'; } catch (e) { }
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    engOsc = AC.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 50;
    engFilter = AC.createBiquadFilter(); engFilter.type = 'lowpass'; engFilter.frequency.value = 260;
    const eg = AC.createGain(); eg.gain.value = 0.045;
    engOsc.connect(engFilter).connect(eg).connect(master); engOsc.start();
  } catch (e) { AC = null; }
}
function envG(t0, a, peak, dur) { const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); return g; }
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!AC || muted) return; const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  o.connect(envG(t, 0.005, vol, dur)).connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, f0, f1, type = 'lowpass', q = 1) {
  if (!AC || muted) return; const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  s.connect(f).connect(envG(t, 0.01, vol, dur)).connect(master); s.start(t); s.stop(t + dur + 0.05);
}
const sfx = {
  shoot() { const n = performance.now(); if (n - lastShootSnd < 70) return; lastShootSnd = n; tone('square', 1200, 420, 0.05, 0.03); },
  hit() { noise(0.05, 0.1, 3200, 1600, 'bandpass', 2); },
  boom(sc) { noise(0.45 + sc * 0.35, Math.min(0.85, 0.3 + sc * 0.22), 2600, 70); tone('sine', 130, 32, 0.35 + sc * 0.2, Math.min(0.6, 0.25 + sc * 0.15)); },
  missile() { noise(0.7, 0.22, 700, 3200, 'bandpass', 1.4); },
  lock() { tone('square', 1700, 1700, 0.045, 0.035); },
  pick() { [660, 880, 1320].forEach((f, i) => tone('triangle', f, f, 0.12, 0.12, i * 0.06)); },
  hurt() { tone('sawtooth', 220, 55, 0.3, 0.22); noise(0.25, 0.3, 1400, 200); },
  roll() { noise(0.45, 0.16, 400, 2600, 'bandpass', 0.8); },
  warp() { tone('sawtooth', 70, 520, 1.8, 0.08); noise(2.4, 0.14, 200, 4200, 'bandpass', 0.7); },
  graze() { tone('sine', 2600, 2400, 0.03, 0.03); },
  alarm() { [0, 0.28, 0.56].forEach(d => tone('square', 520, 380, 0.22, 0.07, d)); },
};
const muteBtn = document.getElementById('mute');
function syncMute() { muteBtn.textContent = muted ? 'OFF' : 'SND'; muteBtn.setAttribute('aria-pressed', String(muted)); if (master) master.gain.value = muted ? 0 : 0.5; }
function toggleMute() { muted = !muted; try { localStorage.setItem('skybreaker-mute', muted ? '1' : '0'); } catch (e) { } initAudio(); syncMute(); }
muteBtn.addEventListener('click', toggleMute); syncMute();

// ---------- input ----------
const keys = {};
const mouse = { x: 0, y: 0, active: false, down: false };
const touch = { id: null, sx: 0, sy: 0, px: 0, py: 0, tx: 0, ty: 0 };
addEventListener('keydown', e => {
  const k = e.code; keys[k] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  if (k === 'KeyP' || k === 'Escape') togglePause();
  if (k === 'KeyM') toggleMute();
  if (state === 'play' && !paused && P.alive) {
    if (k === 'ShiftLeft' || k === 'ShiftRight') barrelRoll();
    if ((k === 'KeyF' || k === 'KeyE') && !e.repeat) fireMissiles();
  }
  if ((k === 'Enter' || (k === 'Space' && document.activeElement.tagName !== 'BUTTON')) && (state === 'title' || state === 'over')) startGame();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; }
  else if (touch.id === e.pointerId) {
    const k = PZ / F * 1.7;
    touch.tx = clamp(touch.px + (e.clientX - touch.sx) * k, -XB, XB);
    touch.ty = clamp(touch.py - (e.clientY - touch.sy) * k, YLO, YHI);
  }
});
cvs.addEventListener('pointerdown', e => {
  initAudio();
  if (e.pointerType === 'mouse') {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
    if (e.button === 0) mouse.down = true;
    if (e.button === 2 && state === 'play' && !paused) fireMissiles();

    for (const x of guns) ctx.drawImage(G.cyan, x - s / 2, 0.05 - s / 2, s, s);
  }
  // roll shield
  if (P.barrel > 0) {
    ctx.globalAlpha = 0.25 + 0.2 * Math.sin(T * 40);
    ctx.strokeStyle = '#7ff3ff'; ctx.lineWidth = 0.05;
    ctx.beginPath(); ctx.ellipse(0, 0, 1.9, 0.9, 0, 0, TAU); ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function drawTrails() {
  ctx.lineCap = 'round';
  for (const tr of trails) {
    for (let i = 1; i < tr.length; i++) {
      const a = tr[i - 1], b = tr[i];
      const al = Math.min(a.a, b.a) * (i / tr.length);
      if (al < 0.02) continue;
      const pa = proj(a.x, a.y, a.z), pb = proj(b.x, b.y, b.z);
      ctx.globalAlpha = al; ctx.strokeStyle = '#f0ecff'; ctx.lineWidth = Math.max(1, 0.07 * pa.s);
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
function drawSpeedLines() {
  const k = clamp((SPD - 55) / 300, 0, 1);
  const base = 0.07 + k * 0.6 + (P.barrel > 0 ? 0.15 : 0);
  ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = '#d9f8ff'; ctx.lineCap = 'round';
  const len = 2 + SPD * 0.07;
  for (const s of speedLines) {
    const z2 = s.z + len; if (s.z < 1.2) continue;
    const a = proj(camX + s.x, camY + s.y, s.z), b = proj(camX + s.x, camY + s.y, z2);
    ctx.globalAlpha = base * clamp((140 - s.z) / 60, 0, 1);
    ctx.lineWidth = Math.max(0.6, 0.04 * a.s);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function drawReticle() {
  const r = ret, inner = proj(P.x, P.y, PZ + 32);
  const lockN = locked.length;
  ctx.strokeStyle = lockN ? 'rgba(255,191,94,0.9)' : 'rgba(127,243,255,0.75)'; ctx.lineWidth = 1.5;
  ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(T * 0.8);
  for (let i = 0; i < 4; i++) { ctx.rotate(TAU / 4); ctx.beginPath(); ctx.arc(0, 0, 20, 0.2, 1.2); ctx.stroke(); }
  ctx.restore();
  ctx.beginPath(); ctx.moveTo(r.x - 5, r.y); ctx.lineTo(r.x + 5, r.y); ctx.moveTo(r.x, r.y - 5); ctx.lineTo(r.x, r.y + 5); ctx.stroke();
  ctx.save(); ctx.translate(inner.x, inner.y); ctx.rotate(Math.PI / 4);
  ctx.strokeRect(-6, -6, 12, 12); ctx.restore();
  // lock brackets
  for (const e of enemies) {
    if (e.lock <= 0 || e.dead) continue;
    const p = proj(e.x, e.y, e.z), k = easeOut(e.lock);
    const sz = (e.rx * p.s * 0.9 + 12) * (1 + (1 - k) * 2.2), rot = (1 - k) * Math.PI / 2;
    const full = e.lock >= 1;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(rot);
    ctx.strokeStyle = full ? '#ff4f6d' : '#ffbf5e'; ctx.lineWidth = full ? 2.2 : 1.5; ctx.globalAlpha = Math.min(1, e.lock * 2);
    const c = sz * 0.35;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.moveTo(-sz, -sz + c); ctx.lineTo(-sz, -sz); ctx.lineTo(-sz + c, -sz); ctx.stroke(); ctx.rotate(Math.PI / 2);
    }
    ctx.restore();
    if (full) {
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(T * 14);
      ctx.fillStyle = '#ff4f6d'; ctx.font = `700 11px ${HUDF}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('LOCK', p.x + sz + 6, p.y - sz + 6);
      ctx.fillStyle = 'rgba(238,242,255,0.7)'; ctx.font = `500 10px ${HUDF}`;
      ctx.fillText(Math.round(e.z * 8) + 'm', p.x + sz + 6, p.y - sz + 20);
    }
    ctx.globalAlpha = 1;
  }
  if (lockN) {
    ctx.fillStyle = '#ffbf5e'; ctx.font = `700 12px ${HUDF}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(`MISSILE LOCK ×${lockN}`, r.x, r.y + 28);
  }
}
function drawPopups() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups) {
    const k = p.t / 1.2;
    const pop = p.t < 0.15 ? 1.7 - (p.t / 0.15) * 0.7 : 1;
    ctx.save(); ctx.translate(p.x, p.y - easeOut(Math.min(1, k * 1.5)) * 50); ctx.scale(pop, pop);
    ctx.globalAlpha = k > 0.6 ? (1 - k) / 0.4 : 1;
    ctx.font = `700 ${p.big ? 22 : 16}px ${HUDF}`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,8,30,0.7)'; ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.col || (p.mult > 1 ? '#ffbf5e' : '#eef2ff'); ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawScreenFX() {
  ctx.globalAlpha = 1;
  if (vignette) ctx.drawImage(vignette, 0, 0, W, H);
  if (warp > 0 || SPD > 90) {
    const k = clamp((SPD - 60) / 340, 0, 1);
    const g = ctx.createRadialGradient(CX, H * 0.5, Math.min(W, H) * 0.25, CX, H * 0.5, Math.max(W, H) * 0.65);
    g.addColorStop(0, 'rgba(127,243,255,0)'); g.addColorStop(1, `rgba(127,200,255,${0.28 * k})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  const low = state === 'play' && P.alive && P.hp < 35 ? (0.5 + 0.5 * Math.sin(T * 6)) * 0.35 : 0;
  const red = Math.max(hurtFlash * 0.7, low);
  if (red > 0.01) {
    const g = ctx.createRadialGradient(CX, H / 2, Math.min(W, H) * 0.2, CX, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,40,70,0)'); g.addColorStop(1, `rgba(255,40,70,${red})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (flashA > 0.01) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,220,180,${flashA})`; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }
  if (whiteout > 0.01) { ctx.fillStyle = `rgba(255,236,232,${whiteout})`; ctx.fillRect(0, 0, W, H); }
}

function spacedText(text, x, y, sp) {
  if ('letterSpacing' in ctx) { ctx.letterSpacing = sp + 'px'; ctx.fillText(text, x, y); ctx.letterSpacing = '0px'; return; }
  ctx.fillText(text, x, y);
}
function drawHUD() {
  if (banner) drawBanner();
  if (state !== 'play') return;
  const L = 20 + safe.l, Rr = W - 20 - safe.r, Tp = 18 + safe.t, B = H - 20 - safe.b;
  const small = W < 560;
  // score
  dispScore += (score - dispScore) * 0.15; if (Math.abs(score - dispScore) < 1) dispScore = score;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(163,171,217,0.85)'; ctx.font = `600 11px ${HUDF}`; spacedText('SCORE', L, Tp, 3);
  ctx.save(); ctx.translate(L, Tp + 15); const sp = 1 + scorePunch * 0.12; ctx.scale(sp, sp);
  ctx.fillStyle = '#eef2ff'; ctx.font = `700 ${small ? 24 : 30}px ${HUDF}`;
  ctx.fillText(String(Math.round(dispScore)).padStart(8, '0'), 0, 0); ctx.restore();
  ctx.fillStyle = 'rgba(163,171,217,0.85)'; ctx.font = `600 11px ${HUDF}`;
  spacedText(`HI ${Math.max(hiScore, score).toLocaleString()}   ·   WAVE ${String(Math.max(wave, 1)).padStart(2, '0')}`, L, Tp + (small ? 46 : 52), 2);

  // combo
  if (combo >= 2) {
    const mult = 1 + Math.floor(combo / 5);
    ctx.textAlign = 'right';
    ctx.save(); ctx.translate(Rr - (small ? 0 : 48), Tp + 50); const cp = 1 + comboPunch * 0.35; ctx.scale(cp, cp); ctx.rotate(-comboPunch * 0.08);
    ctx.font = `400 ${small ? 30 : 40}px ${DISPF}`; ctx.fillStyle = mult > 1 ? '#ffbf5e' : '#eef2ff';
    ctx.fillText('×' + mult, 0, -38); ctx.restore();
    ctx.font = `700 13px ${HUDF}`; ctx.fillStyle = '#eef2ff'; spacedText(combo + ' COMBO', Rr - (small ? 0 : 48), Tp + 54, 2);
    const bw = 110;
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(Rr - (small ? 0 : 48) - bw, Tp + 74, bw, 3);
    ctx.fillStyle = '#ffbf5e'; ctx.fillRect(Rr - (small ? 0 : 48) - bw, Tp + 74, bw * clamp(comboT / 2.6, 0, 1), 3);
  }

  // armor
  const segs = 20, sw = small ? 8 : 10, gap = 3, sh = 14;
  const hr = P.hp / P.maxHp, gr = P.ghost / P.maxHp;
  const col = hr > 0.6 ? '#7ff3ff' : hr > 0.3 ? '#ffbf5e' : '#ff4f6d';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(163,171,217,0.85)'; ctx.font = `600 11px ${HUDF}`; spacedText('ARMOR', L, B - sh - 8, 3);
  ctx.fillStyle = col; ctx.font = `700 13px ${HUDF}`; ctx.fillText(Math.ceil(P.hp) + '%', L + 64, B - sh - 7);
  for (let i = 0; i < segs; i++) {
    const x = L + i * (sw + gap), f = (i + 1) / segs;
    ctx.fillStyle = f <= hr + 1e-6 ? col : f <= gr + 1e-6 ? 'rgba(255,79,109,0.8)' : 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.moveTo(x + 3, B - sh); ctx.lineTo(x + sw + 3, B - sh); ctx.lineTo(x + sw, B); ctx.lineTo(x, B); ctx.closePath(); ctx.fill();
  }

  // missiles + gun
  ctx.textAlign = 'right';
  const mx = Rr - (isTouch ? 0 : 0);
  const mb = isTouch ? B - 190 : B;
  ctx.fillStyle = 'rgba(163,171,217,0.85)'; ctx.font = `600 11px ${HUDF}`; spacedText('MISSILE', mx, mb - sh - 8, 3);
  for (let i = 0; i < 6; i++) {
    const x = mx - 6 - i * 16, y = mb - 7;
    const filled = 5 - i < P.ammo;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = filled ? '#ffbf5e' : 'rgba(255,255,255,0.12)'; ctx.fillRect(-5, -5, 10, 10);
    if (!filled && 5 - i === P.ammo) { ctx.fillStyle = 'rgba(255,191,94,0.55)'; ctx.fillRect(-5, 5 - 10 * P.mCharge, 10, 10 * P.mCharge); }
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(163,171,217,0.85)'; ctx.font = `600 11px ${HUDF}`; spacedText('GUN', mx - 116, mb - sh - 8, 3);
  for (let i = 0; i < 3; i++) { ctx.fillStyle = i < P.weapon ? '#7ff3ff' : 'rgba(255,255,255,0.12)'; ctx.fillRect(mx - 108 - (2 - i) * 9 - 22, mb - 14, 6, 14); }

  // roll cooldown under armor label row (small arc near player? keep minimal)
  if (P.rollCd > 0) {
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(127,243,255,0.6)'; ctx.font = `600 10px ${HUDF}`;
    spacedText('ROLL', L + 110, B - sh - 8, 2);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(L + 146, B - sh - 15, 50, 3);
    ctx.fillStyle = '#7ff3ff'; ctx.fillRect(L + 146, B - sh - 15, 50 * (1 - P.rollCd / 1.1), 3);
  }

  // boss bar
  if (boss && !boss.remove && boss.z < 260) {
    const bw = Math.min(480, W - 40 - safe.l - safe.r), bx = CX - bw / 2, by = Tp + (small ? 78 : 8);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#ff4f6d'; ctx.font = `700 12px ${HUDF}`; spacedText('AEGIS-' + String(wave).padStart(2, '0') + '  비행요새', CX, by, 3);
    ctx.fillStyle = 'rgba(10,8,30,0.6)'; ctx.fillRect(bx, by + 18, bw, 8);
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(bx, by + 18, bw * clamp(boss.ghost / boss.maxHp, 0, 1), 8);
    ctx.fillStyle = '#ff4f6d'; ctx.fillRect(bx, by + 18, bw * clamp(boss.hp / boss.maxHp, 0, 1), 8);
    ctx.fillStyle = 'rgba(7,10,31,0.9)'; ctx.fillRect(bx + bw / 3 - 1, by + 18, 2, 8); ctx.fillRect(bx + bw * 2 / 3 - 1, by + 18, 2, 8);
  }

  if (P.alive && P.hp < 35) {
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(T * 8);
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#ff4f6d'; ctx.font = `700 13px ${HUDF}`;
    spacedText('경고 · 장갑 손상 심각', CX, B - (isTouch ? 0 : 40), 3);
    ctx.globalAlpha = 1;
  }
}
function drawBanner() {
  const b = banner, t = b.t, d = b.dur;
  const inK = easeOut(clamp(t / 0.45, 0, 1)), outK = clamp((t - (d - 0.4)) / 0.4, 0, 1);
  const outE = outK * outK;
  const y = H * 0.27, bh = Math.min(110, H * 0.15);
  const off = (1 - inK) * -W * 1.2 + outE * W * 1.2;
  ctx.save();
  ctx.translate(off, 0);
  // band
  ctx.globalAlpha = 0.82 * (1 - outE);
  ctx.fillStyle = b.warn ? 'rgba(60,8,24,0.75)' : 'rgba(7,10,31,0.62)';
  ctx.beginPath(); ctx.moveTo(-40, y - bh / 2); ctx.lineTo(W + 40, y - bh / 2 - 18); ctx.lineTo(W + 40, y + bh / 2 - 18); ctx.lineTo(-40, y + bh / 2); ctx.closePath(); ctx.fill();
  // edge lines
  ctx.strokeStyle = b.warn ? '#ff4f6d' : '#7ff3ff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-40, y - bh / 2); ctx.lineTo(W + 40, y - bh / 2 - 18); ctx.moveTo(-40, y + bh / 2); ctx.lineTo(W + 40, y + bh / 2 - 18); ctx.stroke();
  if (b.warn) {
    ctx.save(); ctx.beginPath(); ctx.moveTo(-40, y - bh / 2); ctx.lineTo(W + 40, y - bh / 2 - 18); ctx.lineTo(W + 40, y - bh / 2 - 8); ctx.lineTo(-40, y - bh / 2 + 10); ctx.closePath(); ctx.clip();
    ctx.fillStyle = '#ffbf5e';
    for (let x = -60 + (T * 80) % 40; x < W + 60; x += 40) { ctx.beginPath(); ctx.moveTo(x, y - bh / 2 + 20); ctx.lineTo(x + 18, y - bh / 2 + 20); ctx.lineTo(x + 38, y - bh / 2 - 40); ctx.lineTo(x + 20, y - bh / 2 - 40); ctx.fill(); }
    ctx.restore();
  }
  // text
  ctx.globalAlpha = 1 - outE;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fs = Math.min(64, W * 0.11);
  ctx.font = `400 ${fs}px ${DISPF}`;
  const sp = (1 - inK) * 40 + 4;
  const tx = CX + (1 - inK) * 80;
  ctx.fillStyle = b.warn ? (Math.sin(T * 12) > 0 ? '#ff4f6d' : '#ffbf5e') : '#eef2ff';
  ctx.save(); ctx.translate(tx, y - 18 * 0.5 - fs * 0.12); ctx.transform(1, 0, -0.12, 1, 0, 0);
  spacedText(b.text, 0, 0, sp); ctx.restore();
  ctx.font = `600 ${Math.min(15, W * 0.035)}px ${HUDF}`; ctx.fillStyle = b.warn ? '#ffbf5e' : '#7ff3ff';
  spacedText(b.sub, CX - (1 - inK) * 60, y + fs * 0.42, 2);
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) {
    if (slowT > 0) { slowT -= rdt; if (slowT <= 0) timeScale = 1; }
    update(rdt * timeScale, rdt);
  }
  render();
}
addEventListener('resize', resize);
resize();
attractT = 0.5;
requestAnimationFrame(frame);
})();
</script>
