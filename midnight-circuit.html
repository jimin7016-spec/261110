<title>Midnight Circuit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Russo+One&display=swap">
<style>
/* Layout: full-bleed night highway canvas; DOM only for menus. Single dark neon look by design. */
:root{--night:#05060f;--ink:#f1f0ff;--dim:#a4a2c8;--pink:#ff3fa4;--cyan:#3ff0ff;--gold:#ffd25e;
  --display:'Russo One','Arial Black',Impact,sans-serif;--hud:'Chakra Petch','Segoe UI',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--hud);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;
  padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 50%,rgba(5,6,15,.2),rgba(5,6,15,.85));transition:opacity .4s,transform .4s}
.screen.off{opacity:0;pointer-events:none;transform:scale(1.05)}
h1,h2{font-family:var(--display);margin:0;line-height:.9;font-weight:400}
h1{font-size:clamp(44px,11vw,120px);background:linear-gradient(180deg,#fff 10%,var(--cyan) 55%,var(--pink) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:zoom .9s cubic-bezier(.2,1.4,.4,1) both;transform:skewX(-8deg)}
h2{font-size:clamp(44px,10vw,96px);color:var(--gold);animation:zoom .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes zoom{from{transform:skewX(-8deg) scale(2.4);opacity:0;filter:blur(10px)}to{transform:skewX(-8deg);opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sub{color:var(--dim);font-size:16px;max-width:36ch;margin:0;line-height:1.5;animation:up .6s .3s both}
.keys{display:grid;grid-template-columns:auto auto;gap:8px 16px;text-align:left;font-size:14px;color:var(--dim);animation:up .6s .45s both}
.keys b{justify-self:end;display:flex;gap:5px}
kbd{font:600 12px var(--hud);color:var(--ink);border:1px solid rgba(63,240,255,.4);border-bottom-width:3px;border-radius:5px;padding:2px 7px;background:rgba(63,240,255,.08)}
.btn{font:700 19px var(--hud);letter-spacing:.3em;text-indent:.3em;color:#14051a;background:linear-gradient(90deg,var(--pink),#ff9bd2);border:0;padding:16px 48px;cursor:pointer;
  clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:transform .15s;animation:up .6s .6s both}
.btn:hover{transform:scale(1.07) skewX(-6deg)}
.btn:focus-visible{outline:none;background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(90px,1fr));gap:14px;width:min(480px,100%);animation:up .6s .3s both}
.stat{display:flex;flex-direction:column;gap:4px;border-top:2px solid rgba(255,63,164,.5);padding-top:10px}
.stat span{font-size:11px;letter-spacing:.22em;color:var(--dim)}
.stat strong{font-size:24px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){h1,h2,.sub,.keys,.btn,.stats{animation:none!important}}
</style>

<canvas id="c" aria-label="Midnight Circuit race"></canvas>
<section class="screen" id="menu">
  <h1>MIDNIGHT<br>CIRCUIT</h1>
  <p class="sub">자정의 네온 고속도로 3바퀴. 라이벌 9대를 추월하고 1위로 들어오세요.</p>
  <div class="keys">
    <b><kbd>↑</kbd><kbd>W</kbd></b><span>가속</span>
    <b><kbd>←</kbd><kbd>→</kbd><kbd>A</kbd><kbd>D</kbd></b><span>핸들</span>
    <b><kbd>↓</kbd><kbd>S</kbd></b><span>브레이크</span>
    <b><kbd>Shift</kbd><kbd>Space</kbd></b><span>니트로 부스트</span>
  </div>
  <button class="btn" id="go" type="button">레이스 시작</button>
  <p class="sub" id="tHint" hidden>모바일: 화면 좌우를 눌러 핸들, 가속은 자동, 두 손가락이면 니트로</p>
</section>
<section class="screen off" id="end">
  <h2 id="endTitle">FINISH</h2>
  <div class="stats">
    <div class="stat"><span>순위</span><strong id="rPos">-</strong></div>
    <div class="stat"><span>기록</span><strong id="rTime">-</strong></div>
    <div class="stat"><span>최고 기록</span><strong id="rBest">-</strong></div>
  </div>
  <button class="btn" id="again" type="button">다시 달리기</button>
</section>

<script>
(() => {
'use strict';
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch = matchMedia('(pointer: coarse)').matches;
const HUDF = '"Chakra Petch","Segoe UI",sans-serif', DISPF = '"Russo One","Arial Black",sans-serif';
const R = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const easeIn = (a, b, t) => a + (b - a) * t * t, easeInOut = (a, b, t) => a + (b - a) * (-Math.cos(t * Math.PI) / 2 + 0.5);
let W, H, DPR;

// ---------- track ----------
const SEG = 200, RW = 2000, CAMH = 1000, DRAW = 200, LAPS = 3;
const segs = [];
const lastY = () => segs.length ? segs[segs.length - 1].p2.y : 0;
function seg(curve, y) {
  const n = segs.length;
  segs.push({ i: n, p1: { y: lastY(), z: n * SEG, s: {} }, p2: { y, z: (n + 1) * SEG, s: {} }, curve, sprites: [], cars: [], dark: Math.floor(n / 3) % 2 });
}
function road(enter, hold, leave, curve, hill) {
  const sy = lastY(), ey = sy + hill * SEG, tot = enter + hold + leave;
  for (let i = 0; i < enter; i++) seg(easeIn(0, curve, i / enter), easeInOut(sy, ey, i / tot));
  for (let i = 0; i < hold; i++) seg(curve, easeInOut(sy, ey, (enter + i) / tot));
  for (let i = 0; i < leave; i++) seg(easeInOut(curve, 0, i / leave), easeInOut(sy, ey, (enter + hold + i) / tot));
}
road(20, 60, 20, 0, 0);
road(30, 60, 30, 3, 20);
road(25, 40, 25, 0, -30);
road(20, 50, 20, -5, 0);
road(25, 25, 25, 4, 30);
road(25, 25, 25, -4, -10);
road(40, 80, 40, 2, -40);
road(20, 30, 20, -6, 25);
road(30, 60, 30, 0, -25);
road(25, 50, 25, 5, 15);
road(20, 40, 20, -3, -15);
road(30, 60, 30, 0, 30 - lastY() / SEG / 1);
// close the loop vertically
{ const n = 60, sy = lastY(); for (let i = 0; i < n; i++) seg(0, easeInOut(sy, 0, i / n)); }
const N = segs.length, TRACK = N * SEG;
for (let i = 0; i < N; i += 8) { segs[i].sprites.push({ k: 'lamp', o: -1.25 }); segs[i].sprites.push({ k: 'lamp', o: 1.25 }); }
const SIGNS = ['NITRO', '24H', 'ZERO', 'RUSH', 'NOVA', 'DRIFT'];
for (let i = 40; i < N; i += 37 + Math.floor(Math.random() * 30)) segs[i].sprites.push({ k: 'sign', o: Math.random() < .5 ? -1.9 : 1.9, t: SIGNS[i % SIGNS.length], c: Math.random() < .5 ? '#ff3fa4' : '#3ff0ff' });
for (let i = 4; i < N; i += 13) segs[i].sprites.push({ k: 'chev', o: segs[i].curve > 2 ? -1.45 : segs[i].curve < -2 ? 1.45 : 9 });
const segAt = z => segs[Math.floor(((z % TRACK) + TRACK) % TRACK / SEG) % N];

// skyline (pre-rendered)
const sky = document.createElement('canvas'); sky.width = 2400; sky.height = 300;
(() => {
  const g = sky.getContext('2d');
  for (let layer = 0; layer < 2; layer++) {
    let x = 0;
    while (x < sky.width) {
      const w = R(40, 110), h = layer ? R(60, 200) : R(100, 280);
      g.fillStyle = layer ? '#0d0b24' : '#17143a'; g.fillRect(x, 300 - h, w, h);
      for (let wy = 300 - h + 10; wy < 290; wy += 12) for (let wx = x + 6; wx < x + w - 8; wx += 10)
        if (Math.random() < (layer ? .2 : .1)) { g.fillStyle = Math.random() < .7 ? 'rgba(255,210,120,.7)' : 'rgba(63,240,255,.6)'; g.fillRect(wx, wy, 4, 5); }
      if (!layer && Math.random() < .15) { g.fillStyle = '#ff3fa4'; g.fillRect(x + w / 2 - 1, 300 - h - 30, 2, 30); }
      x += w + R(0, 10);
    }
  }
})();
const glow = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.5)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return c; })();
const tinted = {};
function glowOf(col) { if (tinted[col]) return tinted[col]; const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); g.drawImage(glow, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = col; g.globalAlpha = .75; g.fillRect(0, 0, 64, 64); return tinted[col] = c; }

// ---------- state ----------
const MAXS = SEG * 60, NITROS = MAXS * 1.4;
const P = { x: 0, z: 0, speed: 0, nitro: 1, boost: 0, tilt: 0, lap: 1, dist: 0 };
let cars = [], parts = [], state = 'menu', count = 0, raceT = 0, shake = 0, skyX = 0, flash = 0, lapBanner = 0, finishPos = 0;
let camD = 0.84, fovKick = 0, bump = 0;
let best = 0; try { best = parseFloat(localStorage.getItem('mc-best')) || 0; } catch (e) { }
const COLORS = ['#ff3fa4', '#3ff0ff', '#ffd25e', '#8a5cff', '#5dff9a', '#ff7a3c', '#ffffff', '#ff4060', '#40a0ff'];
function resetRace() {
  Object.assign(P, { x: 0, z: 0, speed: 0, nitro: 1, boost: 0, tilt: 0, lap: 1, dist: 0 });
  cars = COLORS.map((c, i) => ({ dist: (i + 1) * SEG * 4, x: [-0.5, 0.5, 0][i % 3], speed: MAXS * R(0.62, 0.8) * (1 - i * 0.012), c, tx: 0 }));
  parts = []; raceT = 0; count = 3.5; state = 'count'; lapBanner = 0;
}

// ---------- input ----------
const keys = {}; const touches = new Map();
addEventListener('keydown', e => { keys[e.code] = true; if (/Arrow|Space/.test(e.code)) e.preventDefault(); if (e.code === 'Enter' && state !== 'race' && state !== 'count') start(); });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
cvs.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') touches.set(e.pointerId, e.clientX); });
cvs.addEventListener('pointermove', e => { if (touches.has(e.pointerId)) touches.set(e.pointerId, e.clientX); });
const up = e => touches.delete(e.pointerId); addEventListener('pointerup', up); addEventListener('pointercancel', up);
if (isTouch) document.getElementById('tHint').hidden = false;
const $ = id => document.getElementById(id);
function start() { resetRace(); $('menu').classList.add('off'); $('end').classList.add('off'); initAudio(); document.activeElement.blur && document.activeElement.blur(); }
$('go').onclick = start; $('again').onclick = start;

// ---------- audio ----------
let AC, eng, engG, filt;
function initAudio() {
  if (AC) { AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    eng = AC.createOscillator(); eng.type = 'sawtooth'; filt = AC.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 600;
    engG = AC.createGain(); engG.gain.value = 0.0001; eng.connect(filt).connect(engG).connect(AC.destination); eng.start();
  } catch (e) { AC = null; }
}
function beep(f, d, v = .15, type = 'square') { if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d); }
function crunch() { if (!AC) return; const t = AC.currentTime, b = AC.createBuffer(1, AC.sampleRate * .3, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = b; g.gain.value = .35; s.connect(g).connect(AC.destination); s.start(t); }

// ---------- update ----------
let lastBeep = 4;
function update(dt) {
  const sp = P.speed / MAXS;
  if (state === 'count') {
    count -= dt; const c = Math.ceil(count);
    if (c !== lastBeep && c >= 0) { lastBeep = c; if (c > 0 && c <= 3) beep(440, .2); if (c === 0) beep(880, .5); }
    if (count <= 0) { state = 'race'; flash = .6; }
  }
  const racing = state === 'race';
  let steer = 0, gas = racing, brake = false, nitro = false;
  if (racing) {
    if (keys.ArrowLeft || keys.KeyA) steer -= 1;
    if (keys.ArrowRight || keys.KeyD) steer += 1;
    brake = keys.ArrowDown || keys.KeyS;
    gas = keys.ArrowUp || keys.KeyW || isTouch || touches.size > 0;
    nitro = keys.ShiftLeft || keys.ShiftRight || keys.Space || touches.size >= 2;
    if (touches.size === 1) { const x = [...touches.values()][0]; steer = x < W / 2 ? -1 : 1; }
    raceT += dt;
  }
  if (state === 'done') { gas = false; }
  const seg = segAt(P.z + CAMH * 0 + SEG * 2);
  // nitro
  const boosting = nitro && P.nitro > 0 && gas && racing;
  if (boosting) { P.nitro = Math.max(0, P.nitro - dt * 0.3); P.boost = Math.min(1, P.boost + dt * 3); }
  else { P.nitro = Math.min(1, P.nitro + dt * 0.06); P.boost = Math.max(0, P.boost - dt * 1.5); }
  const top = MAXS + (NITROS - MAXS) * P.boost;
  if (gas) P.speed += (boosting ? MAXS * 0.9 : MAXS * 0.42 * (1.1 - sp * 0.5)) * dt;
  else if (brake) P.speed -= MAXS * 1.2 * dt;
  else P.speed -= MAXS * 0.25 * dt;
  if (brake) P.speed -= MAXS * 0.9 * dt;
  if (P.speed > top) P.speed -= (P.speed - top) * Math.min(1, dt * 2);
  // steering + centrifugal
  const dx = dt * 2.2 * clamp(sp, 0, 1.2);
  P.x += steer * dx;
  P.x -= dx * sp * seg.curve * 0.32;
  P.tilt += ((steer * 0.08 + seg.curve * sp * 0.012) - P.tilt) * Math.min(1, dt * 8);
  const off = Math.abs(P.x) > 1;
  if (off && P.speed > MAXS * 0.3) { P.speed -= MAXS * 1.1 * dt; shake = Math.max(shake, 0.4 * sp); if (Math.random() < .5) dirt(); }
  P.x = clamp(P.x, -2.2, 2.2);
  P.speed = clamp(P.speed, 0, NITROS);
  P.z += P.speed * dt; P.dist += P.speed * dt;
  // lap
  const lap = Math.floor(P.dist / TRACK) + 1;
  if (lap > P.lap && racing) {
    P.lap = lap;
    if (lap > LAPS) finish(); else { lapBanner = 2.2; flash = .4; beep(660, .15); beep(990, .25, .12); }
  }
  // drift sparks
  const sliding = Math.abs(steer) > 0 && sp > 0.75 && Math.abs(seg.curve) > 2 && !off;
  if (sliding && Math.random() < .8) sparks(steer);
  if (boosting) for (let i = 0; i < 2; i++) parts.push({ x: W / 2 + (Math.random() < .5 ? -1 : 1) * carW() * 0.28, y: carY() + carW() * 0.08, vx: R(-40, 40), vy: R(60, 200), life: .3, max: .3, c: Math.random() < .5 ? '#3ff0ff' : '#ffffff', s: R(3, 7), flame: 1 });
  // rivals
  for (const c of cars) {
    const cs = segAt(c.dist);
    const pace = (racing || state === 'done') ? 1 : 0;
    c.dist += c.speed * dt * pace;
    if (Math.random() < dt * 0.3) c.tx = [-0.6, 0, 0.6][Math.floor(Math.random() * 3)];
    c.x += (c.tx - c.x) * dt * 0.8;
    // avoid player when just ahead
    const gap = c.dist - P.dist;
    if (gap > 0 && gap < SEG * 6 && Math.abs(c.x - P.x) < 0.5) c.x += Math.sign(c.x - P.x || 1) * dt * 0.7;
    // collision
    if (racing && Math.abs(gap - SEG * 1.5) < SEG * 0.8 && Math.abs(c.x - P.x) < 0.42 && P.speed > c.speed) {
      P.speed = c.speed * 0.85; P.x += (P.x > c.x ? 1 : -1) * 0.12; shake = 1.2; flash = .25; crunch();
      for (let i = 0; i < 14; i++) sparks(R(-1, 1));
    }
    c.cs = cs;
  }
  // particles
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.flame ? 0 : 500) * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  skyX += seg.curve * sp * dt * 60;
  shake *= Math.exp(-dt * 6); flash = Math.max(0, flash - dt * 1.5); lapBanner = Math.max(0, lapBanner - dt);
  camD += ((0.84 - P.boost * 0.22) - camD) * Math.min(1, dt * 4);
  bump += dt * (8 + sp * 20);
  if (AC) { const t = AC.currentTime; eng.frequency.setTargetAtTime(50 + sp * 160 + P.boost * 60, t, .05); filt.frequency.setTargetAtTime(400 + sp * 1600, t, .1); engG.gain.setTargetAtTime(state === 'menu' ? 0.0001 : 0.05, t, .2); }
}
const carW = () => Math.min(W * 0.32, 300), carY = () => H - Math.min(H * 0.06, 50) - carW() * 0.3;
function sparks(dir) { const w = carW(); for (let i = 0; i < 2; i++) parts.push({ x: W / 2 + (Math.random() < .5 ? -1 : 1) * w * 0.4, y: carY() + w * 0.18, vx: -dir * R(80, 300) + R(-60, 60), vy: R(-200, -40), life: R(.2, .45), max: .45, c: Math.random() < .5 ? '#ffd25e' : '#fff3c0', s: R(1.5, 3) }); }
function dirt() { const w = carW(); parts.push({ x: W / 2 + R(-.4, .4) * w, y: carY() + w * .2, vx: R(-120, 120), vy: R(-220, -60), life: .5, max: .5, c: '#3a2f5a', s: R(3, 6) }); }
function rank() { return 1 + cars.filter(c => c.dist > P.dist + SEG * 1.5).length; }
function finish() {
  state = 'done'; finishPos = rank(); flash = .8;
  const tm = raceT; const isBest = !best || tm < best;
  if (isBest) { best = tm; try { localStorage.setItem('mc-best', String(best)); } catch (e) { } }
  $('endTitle').textContent = finishPos === 1 ? 'VICTORY' : 'FINISH';
  $('rPos').textContent = finishPos + ' / 10'; $('rTime').textContent = fmt(tm); $('rBest').textContent = fmt(best);
  setTimeout(() => { $('end').classList.remove('off'); $('again').focus(); }, 1400);
  beep(523, .2, .12, 'triangle'); beep(784, .4, .12, 'triangle');
}
const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + s.toFixed(2).padStart(5, '0'); };

// ---------- render ----------
function project(p, cx, cy, cz, loop) {
  const z = p.z - (cz - loop), sc = camD / Math.max(z, 1);
  p.s.x = W / 2 + sc * (-cx) * W / 2; p.s.y = H / 2 - sc * (p.y - cy) * H / 2; p.s.w = sc * RW * W / 2; p.s.sc = sc;
}
function quad(x1, y1, w1, x2, y2, w2, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x1 - w1, y1); ctx.lineTo(x2 - w2, y2); ctx.lineTo(x2 + w2, y2); ctx.lineTo(x1 + w1, y1); ctx.closePath(); ctx.fill(); }
function render(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sh = reduce ? 0 : shake * 6;
  ctx.translate(R(-sh, sh), R(-sh, sh));
  // sky
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  g.addColorStop(0, '#05061a'); g.addColorStop(.6, '#1d1048'); g.addColorStop(1, '#5a1a6a');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .5;
  ctx.drawImage(glowOf('#ff3fa4'), W * 0.5 - H * 0.6, H * 0.15, H * 1.2, H * 0.7);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const base = segAt(P.z), loopZ = 0;
  const pct = ((P.z % TRACK) + TRACK) % TRACK % SEG / SEG;
  const camY = CAMH + easeInOut(base.p1.y, base.p2.y, pct);
  // skyline parallax, anchored to horizon
  const horizon = H / 2 - camD * (0 - camY) * 0 ;
  const sw = sky.width * (H / 900), shh = sky.height * (H / 900);
  const ox = (((-skyX * 2) % sw) + sw) % sw;
  const hy = H * 0.5 - shh + H * 0.02 - (base.p1.y - 0) * 0.002;
  for (let x = -ox; x < W; x += sw) ctx.drawImage(sky, x, hy, sw, shh);
  ctx.fillStyle = '#07071a'; ctx.fillRect(-20, hy + shh - 1, W + 40, H);
  // road
  let maxY = H, x = 0, dx = -(base.curve * pct);
  const pz = ((P.z % TRACK) + TRACK) % TRACK;
  const drawn = [];
  for (let n = 0; n < DRAW; n++) {
    const s = segs[(base.i + n) % N];
    const looped = s.i < base.i ? TRACK : 0;

    project(s.p2, P.x * RW - x - dx, camY, pz - looped, 0);
